name: Build OpenWrt Protun Native APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64_cortex-a53
            sdk_arch: aarch64_cortex-a53-25.12.5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build OpenWrt APK using SDK & Native Rust
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk_arch }}
          CONTAINER: ghcr.io/openwrt/sdk
          PACKAGES: protun

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-protun-${{ matrix.arch }}
          path: bin/packages/**/protun-*.apk
          if-no-files-found: error
